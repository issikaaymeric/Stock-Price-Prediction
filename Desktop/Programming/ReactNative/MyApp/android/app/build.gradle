apply plugin: 'com.android.application'
apply plugin: 'com.facebook.react'
apply plugin: 'com.google.gms.google-services' // ✅ Add this line for Firebase

android {
  namespace 'com.avide.mycantenn' // Change to your actual app ID
  compileSdkVersion 34

  defaultConfig {
    applicationId "com.avide.mycantenn" // Change to your actual app ID
    minSdkVersion 21
    targetSdkVersion 34
    versionCode 1
    versionName "1.0"
  }

  buildTypes {
    release {
      minifyEnabled false
      proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
    }
  }

  compileOptions {
    sourceCompatibility JavaVersion.VERSION_17
    targetCompatibility JavaVersion.VERSION_17
  }

  kotlinOptions {
    jvmTarget = "17"
  }
}

dependencies {
  implementation fileTree(dir: "libs", include: ["*.jar"])

  // Firebase BoM
  implementation platform('com.google.firebase:firebase-bom:33.16.0')

  // ✅ Add your Firebase SDKs here
  implementation 'com.google.firebase:firebase-auth'
  implementation 'com.google.firebase:firebase-firestore'
  implementation 'com.google.firebase:firebase-analytics'

  // React Native dependencies
  implementation 'com.facebook.react:react-android'

  // Other dependencies...
}

apply plugin: 'com.google.gms.google-services'
